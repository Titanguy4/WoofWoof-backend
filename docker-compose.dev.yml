services:
  # --- EUREKA SERVER ---
  eureka-server:
    build:
      context: ./eurekaserver
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - woofwoof-network

  # --- API GATEWAY ---
  api-gateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    container_name: api-gateway-dev
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server   # ✅ attend que Eureka soit lancé avant de démarrer
    restart: always
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/  # pour s’assurer que la variable est disponible
    networks:
      - woofwoof-network

  # --- STAY SERVICE ---
  stay-service:
    build:
      context: ./stayservice
      dockerfile: Dockerfile
    container_name: stay-service-dev
    ports:
      - "8081:8081"
    env_file:
      - ./.env
    depends_on:
      - eureka-server
      - stayservice-db
    networks:
      - woofwoof-network

  stayservice-db:
    image: postgres:15-alpine
    container_name: stay-service-postgres
    environment:
      POSTGRES_DB: ${STAY_SERVICE_DB}
      POSTGRES_USER: ${STAY_SERVICE_USER}
      POSTGRES_PASSWORD: ${STAY_SERVICE_PASSWORD}
    volumes:
      - stay_pgdata:/var/lib/postgresql/data
    ports:
      - ${STAY_SERVICE_DB_PORT}:5432
    networks:
      - woofwoof-network

  # --- BOOKING SERVICE ---
  booking-service:
    build:
      context: ./bookingservice
      dockerfile: Dockerfile
    container_name: booking-service-dev
    env_file:
      - ./.env
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - bookingservice-db
    networks:
      - woofwoof-network

  bookingservice-db:
    image: postgres:15-alpine
    container_name: booking-service-postgres
    environment:
      POSTGRES_DB: ${BOOKING_SERVICE_DB}
      POSTGRES_USER: ${BOOKING_SERVICE_USER}
      POSTGRES_PASSWORD: ${BOOKING_SERVICE_PASSWORD}
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
    ports:
      - ${BOOKING_SERVICE_DB_PORT}:5432
    networks:
      - woofwoof-network

  # --- KEYCLOAK ---
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8000:8080"
    depends_on:
      - keycloak-db
    networks:
      - woofwoof-network

  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    ports:
      - 5435:5432   # ✅ éviter le conflit avec les autres Postgres
    networks:
      - woofwoof-network

# --- VOLUMES & NETWORK ---
volumes:
  stay_pgdata:
  booking_pgdata:
  keycloak_pgdata:

networks:
  woofwoof-network:
    driver: bridge

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${BOOKING_SERVICE_DB_HOST:bookingservice-db}:5432/${BOOKING_SERVICE_DB:bookingservice}
    username: ${BOOKING_SERVICE_DB_USER:bookinguser}
    password: ${BOOKING_SERVICE_DB_PASSWORD:bookingpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      defer-datasource-initialization: true

  kafka:
    bootstrap-servers:
      - kafka:9092

  output:
    ansi:
      enabled: ALWAYS

server:
  port: 8082

eureka:
  instance:
    hostname: booking-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

logging:
  level:
    root: WARN
    "[com.woofwoof.bookingservice]": DEBUG
    "[org.springframework.web]": WARN
    "[org.hibernate]": WARN
    "[org.hibernate.sql]": DEBUG
    "[org.hibernate.type.descriptor.sql]": TRACE

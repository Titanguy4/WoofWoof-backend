spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${BOOKING_SERVICE_DB_HOST:bookingservice-db}:5432/${BOOKING_SERVICE_DB:bookingservice}
    username: ${BOOKING_SERVICE_USER:bookinguser}
    password: ${BOOKING_SERVICE_PASSWORD:bookingpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082

eureka:
  instance:
    hostname: booking-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework: info

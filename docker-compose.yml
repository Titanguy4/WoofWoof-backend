services:
  postgres:
    image: postgres:15-alpine
    container_name: keycloak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8000:8080"
    depends_on:
      - postgres

  eureka:
    container_name: eureka-server
    build:
      context: ./eurekaserver
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - woofwoof-network

  apigateway:
    container_name: api-gateway
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - woofwoof-network

  stay-db:
    image: ${POSTGRES_IMAGE}
    container_name: stay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAY_SERVICE_DB}
      POSTGRES_USER: ${STAY_SERVICE_USER}
      POSTGRES_PASSWORD: ${STAY_SERVICE_PASSWORD}
    volumes:
      - stay_data:/var/lib/postgresql/data
    networks:
      - ${NETWORK_NAME}

  stayservice:
    build:
      context: ./stayservice
      dockerfile: Dockerfile
    container_name: stay-service
    depends_on:
      - stay-db
      - eureka
    ports:
      - "${STAY_SERVICE_PORT}:8080"
    environment:
      STAY_SERVICE_DB_HOST: stay-db
      STAY_SERVICE_DB: ${STAY_SERVICE_DB}
      STAY_SERVICE_USER: ${STAY_SERVICE_USER}
      STAY_SERVICE_PASSWORD: ${STAY_SERVICE_PASSWORD}
      STAY_SERVICE_PORT: ${STAY_SERVICE_PORT}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    networks:
      - ${NETWORK_NAME}




  bookingservice:
    container_name: booking-service
    build:
      context: ./bookingservice
      dockerfile: Dockerfile
    networks:
      - woofwoof-network

networks:
  woofwoof-network:
    driver: bridge

volumes:
  pgdata:
  stay_data:

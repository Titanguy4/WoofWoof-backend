spring:
  application:
    name: stay-service

  datasource:
    url: jdbc:postgresql://${STAY_SERVICE_DB_HOST:stayservice-db}:5432/${STAY_SERVICE_DB:staydb}
    username: ${STAY_SERVICE_DB_USER:stayuser}
    password: ${STAY_SERVICE_DB_PASSWORD:staypass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${STAY_SERVICE_PORT:8081}

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}

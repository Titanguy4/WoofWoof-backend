server:
  port: 8081

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/WoofWoof/protocol/openid-connect/certs
          issuer-uri: http://localhost:8000/realms/WoofWoof

  profiles:
    active:
      - dev

  application:
    name: stay-service

  datasource:
    url: jdbc:postgresql://${STAY_SERVICE_DB_HOST:stayservice-db}:5432/${STAY_SERVICE_DB:staydb}
    username: ${STAY_SERVICE_DB_USER:stayuser}
    password: ${STAY_SERVICE_DB_PASSWORD:staypass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

logging:
  level:
    "[com.woofwoof.stayservice]": DEBUG
    "[org.springframework.security.oauth2.core]": DEBUG
